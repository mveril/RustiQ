[package]
name = "rustiq-chem-core"
description = "A reusable Rust library for modern quantum chemistry software"
authors.workspace = true
version = "0.1.0-beta.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rustiq-chem-core"
readme = "README.md"
keywords.workspace = true
categories = ["science::computational-chemistry::electronic-structure"]

# Preserve the Rust import name independently of the Cargo package name.
[lib]
name = "rustiq_core"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/rustdoc-mathjax.html"]

[lints]
workspace = true

[features]
default = []
online = ["dep:reqwest", "dep:tokio"]
bench = []

[dependencies]
itertools = { version = "0.14", default-features = false }
miette.workspace = true
reqwest = { version = "0.13", default-features = false, optional = true, features = [
  "json",
  "blocking",
  "rustls",
] }
nalgebra.workspace = true
npyz = "0.9.1"
mendeleev.workspace = true
rayon.workspace = true
relative-path.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"], optional = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde.workspace = true
sha2 = "0.11.1"
delegate.workspace = true
bounded-vec-deque = "0.1.1"
thiserror.workspace = true
rand.workspace = true
rand_chacha = "0.10"
petname = { version = "3.1", default-features = false }
rand_distr = "0.6"
special = { version = "0.14", default-features = false, features = ["std"] }
factorial = "0.4.0"
nutype = "0.8"
const_format = "0.2"
smallvec = "1"
tempfile.workspace = true
bytesize.workspace = true
sysinfo.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
mendeleev.workspace = true

[dev-dependencies]
approx.workspace = true
nalgebra = { workspace = true, features = ["macros"] }
ndarray = "0.17"
proptest.workspace = true
rstest.workspace = true

name: Recover beta corresponding source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v0.1.0-beta.1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build corresponding source from the original tag
        run: python3 tools/distribution.py source
      - name: Attach corresponding source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s target/distrib/rustiq-corresponding-source.tar.gz
          gh release upload v0.1.0-beta.1 --clobber target/distrib/rustiq-corresponding-source.tar.gz

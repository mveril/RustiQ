name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-tag:
    name: Check tag version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a matching package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          package_version() {
            awk '$0 == "[package]" { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && /^version = / { gsub(/version = /, ""); gsub(/"/, ""); print; exit }' "$1"
          }
          test "$version" = "$(package_version Cargo.toml)"
          test "$version" = "$(package_version crates/rustiq-core/Cargo.toml)"
          dependency_version=$(sed -n '/^rustiq-core = /{s/.*version = "\([^"]*\)".*/\1/p;}' Cargo.toml)
          test "$version" = "$dependency_version"

  build:
    name: Build (${{ matrix.target }})
    needs: check-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build RustiQ
        run: cargo build --locked --release --target ${{ matrix.target }} --bin rustiq

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="RustiQ-${TAG}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/rustiq" "dist/${name}/rustiq"
          cp LICENSE-APACHE LICENSE-MIT README.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          $name = "RustiQ-$env:TAG-$env:TARGET"
          $directory = "dist/$name"
          New-Item -ItemType Directory -Force $directory | Out-Null
          Copy-Item "target/$env:TARGET/release/rustiq.exe" "$directory/rustiq.exe"
          Copy-Item LICENSE-APACHE, LICENSE-MIT, README.md $directory
          Compress-Archive -Path "$directory/*" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.3
        with:
          name: release-${{ matrix.target }}
          path: dist/RustiQ-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  publish-crates:
    name: Publish Cargo workspace
    needs: check-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Publish every workspace package to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured" >&2
            exit 1
          fi
          cargo publish --workspace --locked --token "$CARGO_REGISTRY_TOKEN"

  publish:
    name: Publish GitHub Release
    needs: [build, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate and verify global checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "RustiQ $TAG" \
            "${release_flags[@]}"

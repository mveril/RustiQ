name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Dependency policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked --workspace --all-features

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Check distribution notice coverage
        run: python3 tools/distribution.py check

  cargo:
    name: Cargo without Nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            windows-latest,
            windows-11-arm,
            macos-latest,
            macos-15-intel,
          ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy without online feature
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Test default features
        run: cargo test --workspace --all-targets

      - name: Test all features
        run: cargo test --workspace --all-targets --all-features

      - name: Test without default features
        run: cargo test --workspace --all-targets --no-default-features

      - name: Test CLI generators independently
        run: |
          cargo test -p rustiq-chem --test generation_cli --no-default-features --features manpages
          cargo test -p rustiq-chem --test generation_cli --no-default-features --features completions

      - name: Check the standalone core
        run: |
          cargo check -p rustiq-chem-core --no-default-features
          cargo test -p rustiq-chem-core --no-default-features

  uv:
    name: Python tooling with uv (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust stable for persistence interoperability
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo for persistence interoperability
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check Python tooling
        run: |
          uv sync --locked --python ${{ matrix.python-version }}
          uv run --locked --python ${{ matrix.python-version }} python --version
          uv run --locked --python ${{ matrix.python-version }} ruff --version
          uv run --locked --python ${{ matrix.python-version }} pytest --version
          uv run --locked --python ${{ matrix.python-version }} pytest tools/test_book_links.py tools/test_publish_docs.py tools/test_release_smoke.py tools/benchmarks tools/reference -m "not requires_rust" -k "not reads_rust"

      - name: Test Rust and NumPy persistence interoperability on Windows
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        run: uv run --locked --python ${{ matrix.python-version }} pytest tools/reference/test_persistence_interop.py -k reads_rust

  nix:
    name: Nix flake (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: aarch64-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3

      - name: Restore bounded Nix cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml', 'pyproject.toml', 'uv.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 1G

      - name: Evaluate flake outputs
        if: matrix.system == 'x86_64-linux'
        run: nix flake check --no-build

      - name: Check the Python lock
        run: nix develop .#full --command uv lock --check

      - name: Build with the minimal Rust shell
        run: nix develop .#mini-rust --command cargo build --workspace --all-targets --all-features

      - name: Check the Rust development shell
        run: nix develop .#rust --command rust-analyzer --version

      - name: Check the minimal PySCF shell
        run: nix develop .#mini-pyscf --command python -c "import pyscf; print('PySCF', pyscf.__version__)"

      - name: Check the pyscf-check application
        if: matrix.system == 'x86_64-linux'
        run: nix run .#pyscf-check -- -k "h2-sto-3g-rhf and not mp2"

      - name: Check reference energies against PySCF
        run: nix develop .#mini-pyscf --command pytest tools/reference

      - name: Build RustiQ with Nix
        run: nix build .#default

      - name: Keep Crane artifacts for the cache
        run: nix build .#cargo-artifacts --out-link result-cargo-artifacts

  devcontainer:
    name: Dev Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify Dev Container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -eux
            nix print-dev-env . --json > /dev/null
            nix develop .#full --command bash -c '
              set -eux
              command -v cargo
              command -v rustc
              command -v rust-analyzer
              cargo fmt --version
              cargo clippy --version
              cargo nextest --version
              cargo deny --version
              cargo-about --version
              cargo llvm-cov --version
              cargo criterion --version
              cargo expand --version
              for tool in cargo-add cargo-rm cargo-set-version cargo-upgrade; do "$tool" --help > /dev/null; done
              dist --version
              cargo-info --help > /dev/null
              cargo info --help > /dev/null
              cargo watch --version
              if command -v cargo-flamegraph >/dev/null; then cargo-flamegraph --help > /dev/null; cargo flamegraph --help > /dev/null; fi
              command -v bacon
              command -v nixd
              command -v nixfmt
              command -v ruff
              command -v uv
              command -v python
              command -v pytest
              jupyter --version
              cargo --version
              rustc --version
              rust-analyzer --version
              python -c '\''import pyscf; print("PySCF", pyscf.__version__)'\''
              python -c '\''import ipykernel, jupyterlab, matplotlib, numpy, scipy'\''
              ruff --version
              uv --version
              cargo metadata --no-deps --format-version 1 > /dev/null
              cargo build --workspace --all-targets --all-features
              cargo test --workspace --all-targets --all-features
              pytest tools/reference
            '

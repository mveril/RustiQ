name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: Cargo without Nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test default features
        run: cargo test --all-targets --all-features

      - name: Test without online feature
        run: cargo test --all-targets --no-default-features

  nix:
    name: Nix flake (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: aarch64-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3

      - name: Restore bounded Nix cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml', 'pyproject.toml', 'uv.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 1G

      - name: Evaluate flake outputs
        if: matrix.system == 'x86_64-linux'
        run: nix flake check --all-systems --no-build

      - name: Check the Python lock
        run: nix develop .#full --command uv lock --check

      - name: Build with the minimal Rust shell
        run: nix develop .#mini-rust --command cargo build --all-targets --all-features

      - name: Check the Rust development shell
        run: nix develop .#rust --command rust-analyzer --version

      - name: Check the minimal PySCF shell
        run: nix develop .#mini-pyscf --command python -c "import pyscf; print('PySCF', pyscf.__version__)"

      - name: Test the reference comparison tooling
        run: nix develop .#mini-pyscf --command pytest tools/reference

      - name: Build RustiQ with Nix
        run: nix build .#default

      - name: Keep Crane artifacts for the cache
        run: nix build .#cargo-artifacts --out-link result-cargo-artifacts
      - name: Check H2 energy against PySCF
        run: nix run .#pyscf-check -- h2-sto-3g-rhf

  devcontainer:
    name: Dev Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify Dev Container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -eux
            nix print-dev-env . --json > /dev/null
            nix develop .#full --command bash -c '
              set -eux
              command -v cargo
              command -v rustc
              command -v rust-analyzer
              command -v nixd
              command -v nixfmt
              command -v ruff
              command -v uv
              command -v python
              command -v pytest
              cargo --version
              rustc --version
              rust-analyzer --version
              python -c '\''import pyscf; print("PySCF", pyscf.__version__)'\''
              cargo metadata --no-deps --format-version 1 > /dev/null
              cargo build --all-targets --all-features
              cargo test --all-targets --all-features
              pytest tools/reference
            '

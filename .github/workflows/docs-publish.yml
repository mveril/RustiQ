name: Publish documentation

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: docs-pages
  queue: max

jobs:
  build:
    name: Assemble and publish the manual
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import importlib.util, sys, tomllib
          spec = importlib.util.spec_from_file_location('publisher', 'tools/publish-docs.py')
          publisher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publisher)
          publisher.version_key(sys.argv[1])
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          if sys.argv[1] != 'v' + version:
              raise SystemExit(f'tag {sys.argv[1]} does not match package version {version}')
          PY
      - name: Build offline manual
        run: nix build .#book
      - name: Assemble and store site
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add /tmp/rustiq-pages origin/gh-pages
          else
            git worktree add --detach /tmp/rustiq-pages
            git -C /tmp/rustiq-pages switch --orphan gh-pages
            git -C /tmp/rustiq-pages rm -rf --ignore-unmatch .
          fi
          if [[ "$REF_TYPE" == tag ]]; then
            python3 tools/publish-docs.py result /tmp/rustiq-pages "$revision" --version "$RELEASE_TAG"
          else
            python3 tools/publish-docs.py result /tmp/rustiq-pages "$revision" --development
          fi
          git -C /tmp/rustiq-pages config user.name 'github-actions[bot]'
          git -C /tmp/rustiq-pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/rustiq-pages add -A
          if ! git -C /tmp/rustiq-pages diff --cached --quiet; then
            git -C /tmp/rustiq-pages commit -m 'Update published documentation'
            git -C /tmp/rustiq-pages push origin HEAD:gh-pages
          fi
      - name: Prepare Pages artifact
        run: |
          mkdir -p /tmp/rustiq-site
          rsync -a --exclude=/.git /tmp/rustiq-pages/ /tmp/rustiq-site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: /tmp/rustiq-site

  deploy:
    name: Publish the manual
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

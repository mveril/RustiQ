name: Build release manual

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - name: Build and validate offline manual
        run: nix build .#book
      - name: Prepare release artifact
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp -rL result manual-artifact
          chmod -R u+w manual-artifact
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: offline-manual
          path: manual-artifact/
          if-no-files-found: error

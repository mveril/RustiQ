name: Release artifact smoke test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Optional commit, branch, or tag to rehearse; blank tests the selected workflow revision
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manual:
    uses: ./.github/workflows/build-release-manual.yml
    with:
      ref: ${{ inputs.ref }}

  build:
    needs: manual
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Record tested revision
        shell: bash
        env:
          SELECTED_REF: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ -z "$SELECTED_REF" && "$actual" != "$WORKFLOW_SHA" ]]; then
            echo "::error::Expected workflow commit $WORKFLOW_SHA, checked out $actual"
            exit 1
          fi
          printf 'Testing commit: %s\n' "$actual"
          printf 'Smoke test revision: `%s` (ref: `%s`)\n' "$actual" "${SELECTED_REF:-workflow-selected commit}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - id: install_unix
        name: Install configured dist version from release assets
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          DIST_VERSION="$(python -c 'import re; from pathlib import Path; print(re.search(r"cargo-dist-version\s*=\s*\"([^\"]+)\"", Path("dist-workspace.toml").read_text()).group(1))')"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      - id: install_windows_x64
        name: Install configured dist version on Windows x64
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $match = Select-String -Path dist-workspace.toml -Pattern 'cargo-dist-version\s*=\s*"([^"]+)"'
          if (-not $match) { throw 'Could not read cargo-dist-version from dist-workspace.toml' }
          $version = $match.Matches[0].Groups[1].Value
          Invoke-Expression (Invoke-RestMethod "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.ps1")

      - id: install_windows_arm64
        name: Build configured dist version from source on Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $match = Select-String -Path dist-workspace.toml -Pattern 'cargo-dist-version\s*=\s*"([^"]+)"'
          if (-not $match) { throw 'Could not read cargo-dist-version from dist-workspace.toml' }
          $version = $match.Matches[0].Groups[1].Value
          cargo install --git https://github.com/axodotdev/cargo-dist --tag "v$version" --locked cargo-dist

      - id: verify_dist
        name: Verify pinned dist version
        shell: bash
        run: |
          python -c 'import re, subprocess; from pathlib import Path; v=re.search(r"cargo-dist-version\s*=\s*\"([^\"]+)\"", Path("dist-workspace.toml").read_text()).group(1); actual=subprocess.check_output(["dist", "--version"], text=True); assert v in actual, f"configured {v}, installed {actual}"'
          dist --version

      - name: Download offline manual
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: offline-manual
          path: manual/html

      - id: build
        name: Build target archive with dist
        shell: bash
        run: |
          set -euo pipefail
          # Do not pre-create an empty manifest inside dist's artifact directory.
          # Follow the generated release workflow and copy the completed JSON.
          if ! dist build --artifacts=local --target "${{ matrix.target }}" --output-format=json > dist-manifest.json 2> dist-build.log; then
            cat dist-build.log
            echo 'ARCHIVE_BUILD_FAILURE'
            exit 1
          fi
          python -m json.tool dist-manifest.json > /dev/null
          python -c 'import json; from pathlib import Path; files=json.loads(Path("dist-manifest.json").read_text())["upload_files"]; assert isinstance(files, list) and files, "dist manifest has no upload_files"'
          mkdir -p target/distrib
          cp dist-manifest.json "target/distrib/${{ matrix.target }}-dist-manifest.json"

      - name: Upload distributable packages
        id: packages
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rustiq-packages-${{ matrix.target }}
          path: |
            target/distrib/*.tar.gz
            target/distrib/*.zip
            target/distrib/*.sha256
            target/distrib/sha256.sum
            target/distrib/*-dist-manifest.json
          if-no-files-found: error

      - name: Link downloadable packages
        if: steps.packages.outcome == 'success'
        shell: bash
        env:
          PACKAGE_URL: ${{ steps.packages.outputs.artifact-url }}
          TARGET: ${{ matrix.target }}
        run: |
          printf '[Download packages for %s](%s) (archive and checksums)\n' "$TARGET" "$PACKAGE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive, manifest, and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-build-${{ matrix.target }}
          path: |
            target/distrib/**
            dist-manifest.json
            dist-build.log
            validation.log
            release-smoke-logs/**
          if-no-files-found: warn

  global:
    name: Assemble release packages with dist
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install configured dist version
        shell: bash
        run: |
          set -euo pipefail
          DIST_VERSION="$(python3 -c 'import re; from pathlib import Path; print(re.search(r"cargo-dist-version\s*=\s*\"([^\"]+)\"", Path("dist-workspace.toml").read_text()).group(1))')"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh

      - name: Download native packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rustiq-packages-*
          path: target/distrib
          merge-multiple: true

      - name: Build global release assets
        shell: bash
        run: |
          set -euo pipefail
          dist build --artifacts=global --output-format=json > dist-manifest.json
          dist print-upload-files-from-manifest --manifest dist-manifest.json > global-upload-files.txt
          mkdir -p release-packages
          cp target/distrib/*.tar.gz target/distrib/*.zip target/distrib/*.sha256 release-packages/
          while IFS= read -r asset; do
            cp "$asset" release-packages/
          done < global-upload-files.txt

      - name: Upload complete release packages
        id: release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rustiq-release-packages
          path: release-packages/*
          if-no-files-found: error

      - name: Link complete release download
        env:
          PACKAGE_URL: ${{ steps.release.outputs.artifact-url }}
        run: |
          printf '[Download all release packages](%s) — native archives, checksums, and corresponding source.\n' "$PACKAGE_URL" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke final packages (${{ matrix.target }})
    needs: global
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Download final release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustiq-release-packages
          path: release-packages

      - name: Validate final archive and run H2 calculation
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python - <<'PYTHON' 2>&1 | tee validation.log
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path("release-packages")
          target = os.environ["TARGET"]
          suffix = ".zip" if "windows" in target else ".tar.gz"
          archives = list(root.glob(f"*-{target}{suffix}"))
          if len(archives) != 1:
              raise SystemExit(f"MISSING_ARCHIVE: expected one archive for {target}, got {archives}")
          checksum = root / "sha256.sum"
          if not checksum.is_file():
              raise SystemExit("CHECKSUM_FAILURE: final release has no sha256.sum")
          subprocess.run([
              sys.executable, "tools/release_smoke.py", str(archives[0]),
              "--checksum", str(checksum),
              "--fixture", "tests/data/sto-3g.json",
              "--geometry", "samples/h2/molecule.xyz",
              "--reference-source", "crates/rustiq-core/src/hf/scf.rs",
              "--logs", "release-smoke-logs",
          ], check=True)
          PYTHON

      - name: Report final package result
        if: always()
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RESULT: ${{ job.status }}
        run: |
          printf 'Final release package smoke test: `%s` — **%s**\n' "$TARGET" "$RESULT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-smoke-${{ matrix.target }}
          path: |
            validation.log
            release-smoke-logs/**
          if-no-files-found: warn

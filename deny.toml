[advisories]
version = 2
# Acknowledge only the informational maintenance notices for retained
# transitive dependencies. Vulnerability advisories remain denied.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "Bincode 1.3.3 is retained by bat/syntect; this advisory reports discontinued maintenance, not a vulnerability." },
    { id = "RUSTSEC-2024-0449", reason = "Nickel uses serde_yaml_ng/unsafe-libyaml; replacing its parser is outside this dependency backport." },
    { id = "RUSTSEC-2024-0320", reason = "Syntect uses yaml-rust to compile syntax assets; this advisory reports discontinued maintenance, not a vulnerability." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
confidence-threshold = 0.93
include-dev = true
# Binary distributions follow DISTRIBUTION.md and include corresponding source.
# Copyleft and data-license approvals are restricted to the reviewed versions.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.exceptions]]
name = "ansi_colours"
version = "=1.2.3"
allow = ["LGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "malachite"
version = "=0.9.2"
allow = ["LGPL-3.0-only"]

[[licenses.exceptions]]
name = "malachite-base"
version = "=0.9.2"
allow = ["LGPL-3.0-only"]

[[licenses.exceptions]]
name = "malachite-float"
version = "=0.9.2"
allow = ["LGPL-3.0-only"]

[[licenses.exceptions]]
name = "malachite-nz"
version = "=0.9.2"
allow = ["LGPL-3.0-only"]

[[licenses.exceptions]]
name = "malachite-q"
version = "=0.9.2"
allow = ["LGPL-3.0-only"]

[[licenses.exceptions]]
name = "imbl-sized-chunks"
version = "=0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "option-ext"
version = "=0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.9"
allow = ["CDLA-Permissive-2.0"]

# Select the BSD alternative from the actual upstream license text.
[[licenses.clarify]]
name = "bounded-vec-deque"
version = "=0.1.1"
expression = "BSD-3-Clause"
license-files = [{ path = "LICENSE-BSD", hash = 0xe87d5752 }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[project]
name = "rustiq-reference-tools"
version = "0.0.0"
description = "Python tooling used to validate RustiQ against reference implementations"
requires-python = ">=3.12,<3.15"
# PySCF publishes native Windows wheels for x86-64; Windows ARM64 still requires WSL2.
dependencies = ["pyscf==2.15.0; sys_platform != 'win32' or platform_machine == 'AMD64' or platform_machine == 'x86_64'"]

[dependency-groups]
test = ["numpy", "pytest"]
dev = ["ipykernel", "jupyterlab", "matplotlib", "scipy"]
linting = ["ruff"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]
no-build = true
default-groups = ["dev", "test", "linting"]

[tool.pytest.ini_options]
markers = ["requires_rust: test invokes Cargo or the RustiQ executable"]

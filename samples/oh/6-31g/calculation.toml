[basis]
name = "6-31g"

[molecule]
geometry = "../oh.xyz"
units = "Angstrom"
charge = 0
multiplicity = 2

[method.hf]
method = "Uhf"
convergence_threshold = 1e-12
max_iterations = 100

[method.hf.guess]
type = "Random"
distribution = "Normal"
mean = 0.0
std_dev = 1.0
seed = 42

[method.hf.diis]
enabled = true
max_history = 8

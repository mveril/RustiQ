[workspace]
members = ["crates/rustiq-core"]
default-members = [".", "crates/rustiq-core"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Individual lint settings and local, documented exceptions override these groups.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
let_underscore_must_use = "deny"
exit = "deny"
lossy_float_literal = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"

[lints]
workspace = true

[workspace.dependencies]
bytesize = "2.7"
approx = "0.5.1"
bat = { version = "0.26", default-features = false, features = ["regex-onig"] }
delegate = "0.13"
miette = { version = "7", default-features = false, features = ["derive"] }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
periodic_table = "0.5"
proptest = "1"
rand = "0.10"
rayon = "1"
relative-path = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.*"
sysinfo = { version = "0.39.6", default-features = false, features = [
  "system",
] }
temp-env = "0.3"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", default-features = false }

[package]
name = "RustiQ"
description = "The modern rust quantum chemistry software"
authors = ["Mickaël Véril"]
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mveril/RustiQ"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["online"]
online = ["rustiq-core/online", "dep:indicatif", "dep:tokio"]
bench-support = ["rustiq-core/bench-support"]

[dependencies]
bytesize.workspace = true
rustiq-core = { path = "crates/rustiq-core", version = "0.1.0-alpha.1", default-features = false }
directories = "6"
miette = { workspace = true, features = ["fancy"] }
clap = { version = "4.6", features = ["cargo", "derive", "env"] }
anstream = "1"
anstyle = "1"
indicatif = { version = "0.18", optional = true }
nalgebra.workspace = true
periodic_table.workspace = true
rayon.workspace = true
tokio = { workspace = true, features = ["rt"], optional = true }
serde_json.workspace = true
serde.workspace = true
delegate.workspace = true
thiserror.workspace = true
rand.workspace = true
tabled = "0.22"
humantime = "2"
figlet-rs = "1"
bat = { workspace = true, features = ["paging"] }
cfg-if = "1"
tempfile.workspace = true
# Native in-memory TOML imports and structured diagnostics require the core API.
nickel-lang-core = { version = "=0.19.0", default-features = false }
# Preserve Nickel's TOML layout while choosing readable float representations.
toml_edit = "0.25"

[dev-dependencies]
approx.workspace = true
jsonschema = { version = "0.29", default-features = false }
rstest = "0.27"
proptest.workspace = true
temp-env.workspace = true

[[bench]]
name = "mp2_timings"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "eri_timings"
harness = false
required-features = ["bench-support"]

[build-dependencies]
bat = { workspace = true, features = ["build-assets"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

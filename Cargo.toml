[workspace]
members = ["crates/rustiq-core"]
default-members = [".", "crates/rustiq-core"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Individual lint settings and local, documented exceptions override these groups.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
let_underscore_must_use = "deny"
exit = "deny"
lossy_float_literal = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"

[lints]
workspace = true

[workspace.dependencies]
bytesize = "2.7"
approx = "0.5.1"
bat = { version = "0.26", default-features = false, features = ["regex-onig"] }
delegate = "0.13"
miette = { version = "7", default-features = false, features = ["derive"] }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
mendeleev = { version = "0.8.4", default-features = false, features = [
  "atomic_number",
  "atomic_weight",
  "element_list",
  "name",
  "symbol",
] }
proptest = "1"
rand = "0.10"
rayon = "1"
relative-path = { version = "2", features = ["serde"] }
rstest = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.*"
supports-hyperlinks = "3"
sysinfo = { version = "0.39.6", default-features = false, features = [
  "system",
] }
temp-env = "0.3"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", default-features = false }

[package]
name = "rustiq-chem"
description = "The modern rust quantum chemistry software"
authors = ["Mickaël Véril"]
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mveril/RustiQ"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "rustiq"
path = "src/main.rs"

[features]
default = ["online", "manpages", "completions"]
online = ["rustiq-core/online", "dep:indicatif", "dep:tokio"]
bench-support = ["rustiq-core/bench-support"]
manpages = ["dep:clap_mangen"]
completions = ["dep:clap_complete", "dep:clap_complete_nushell", "dep:sysinfo"]

[dependencies]
bytesize.workspace = true
rustiq-core = { package = "rustiq-chem-core", path = "crates/rustiq-core", version = "0.1.0-alpha.1", default-features = false }
directories = "6"
miette = { workspace = true, features = ["fancy"] }
clap = { version = "4.6", features = ["cargo", "derive", "env"] }
anstream = "1"
anstyle = "1"
indicatif = { version = "0.18", optional = true }
nalgebra.workspace = true
mendeleev.workspace = true
rayon.workspace = true
tokio = { workspace = true, features = ["rt"], optional = true }
serde_json.workspace = true
serde.workspace = true
supports-hyperlinks.workspace = true
delegate.workspace = true
thiserror.workspace = true
rand.workspace = true
tabled = "0.22"
humantime = "2"
rusty-figlet = { version = "0.3", default-features = false }
bat = { workspace = true, features = ["paging"] }
cfg-if = "1"
tempfile.workspace = true
# Native in-memory TOML imports and structured diagnostics require the core API.
nickel-lang-core = { version = "=0.19.0", default-features = false }
# Preserve Nickel's TOML layout while choosing readable float representations.
toml_edit = "0.25"
clap_complete = { version = "4.6.11", optional = true }
clap_mangen = { version = "0.3.3", optional = true }
clap_complete_nushell = { version = "4.6.2", optional = true }
sysinfo = { workspace = true, optional = true }
open = "5"

[dev-dependencies]
vergen-gix = { version = "10", features = ["cargo", "rustc"] }
approx.workspace = true
criterion = "0.8"
jsonschema = { version = "0.29", default-features = false }
rstest.workspace = true
proptest.workspace = true
temp-env.workspace = true

[[bench]]
name = "mp2_timings"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "eri_timings"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "eri_storage_allocation"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "eri_storage_memory"
harness = false
required-features = ["bench-support"]

[build-dependencies]
bat = { workspace = true, features = ["build-assets"] }
toml_edit = "0.25"
vergen-gix = { version = "10", features = ["cargo", "rustc"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
